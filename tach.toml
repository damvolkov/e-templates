##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails.
layers = ["api", "adapters", "core", "models"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_app"
layer = "api"
depends_on = []

[[modules]]
path = "e_app.api"
layer = "api"
depends_on = []

[[modules]]
path = "e_app.websockets"
layer = "api"
depends_on = []

[[modules]]
path = "e_app.adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "e_app.core"
layer = "core"
depends_on = []

[[modules]]
path = "e_app.models"
layer = "models"
depends_on = []
