##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

[rules]
unused_ignore_directives = "error"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails.
layers = ["api", "pipelines", "adapters", "core"]

##### MODULES #####
[[modules]]
path = "e_api"
layer = "api"
depends_on = []

[[modules]]
path = "e_api.core"
layer = "core"
depends_on = []
