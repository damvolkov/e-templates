services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    hostname: vllm
    restart: unless-stopped
    ipc: host
    labels:
      stack.category: "llm"
      stack.port: "8000"
    ports:
      # default 8000 — vLLM OpenAI-compatible server
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_ATTENTION_BACKEND=${VLLM_ATTENTION_BACKEND:-FLASHINFER}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command: >-
      --model Qwen/Qwen3-32B-AWQ
      --quantization awq_marlin
      --dtype auto
      --served-model-name ${LLM_SERVED_NAME:-qwen3-32b}
      --gpu-memory-utilization 0.95
      --max-model-len 8192
      --port 8000
      --api-key ${VLLM_API_KEY:-local-dev}
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --tensor-parallel-size 1
      --enforce-eager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - stack

volumes:
  vllm-cache:

networks:
  stack:
    name: stack
