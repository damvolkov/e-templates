services:
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling
    hostname: docling
    restart: unless-stopped
    labels:
      stack.category: "rag"
      stack.port: "5001"
    ports:
      # Docling — extraccion de documentos
      - "${DOCLING_PORT:-5001}:5001"
    volumes:
      - docling-data:/app/data
    environment:
      - DOCLING_SERVE_ENABLE_UI=${DOCLING_UI:-1}
      - DOCLING_SERVE_HOST=0.0.0.0
      - DOCLING_SERVE_PORT=5001
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - stack

volumes:
  docling-data:

networks:
  stack:
    name: stack
