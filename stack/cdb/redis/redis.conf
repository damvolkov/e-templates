# e-core Redis default config
bind 0.0.0.0
protected-mode no
port 6379

# Auth
requirepass redis_password

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (disabled — ephemeral cache)
save ""
appendonly no

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Logging
loglevel notice
