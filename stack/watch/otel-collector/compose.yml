services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    hostname: otel-collector
    restart: unless-stopped
    labels:
      stack.category: "watch"
      stack.port: "4317"
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC — destino de opencode-plugin-otel
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP (alternativa)
      - "8889:8889"                       # metricas para scrapeo de Prometheus
    networks:
      - stack

networks:
  stack:
    name: stack
