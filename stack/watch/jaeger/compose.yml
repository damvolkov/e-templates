services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    hostname: jaeger
    restart: unless-stopped
    labels:
      stack.category: "watch"
      stack.port: "16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # UI; el collector recibe OTLP interno en 4317 via red stack
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - stack

networks:
  stack:
    name: stack
